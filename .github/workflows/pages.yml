name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versão do cache do app
        run: sed -i "s/gtm-v1/gtm-${GITHUB_SHA::8}/" web/sw.js
      - name: Chave da API do Google Sheets
        if: ${{ vars.SHEETS_API_KEY != '' }}
        env:
          KEY: ${{ vars.SHEETS_API_KEY }}
        run: |
          if ! printf '%s' "$KEY" | grep -Eq '^[A-Za-z0-9_-]+$'; then echo "SHEETS_API_KEY com caracteres inválidos"; exit 1; fi
          sed -i "s/sheetsApiKey: \"\"/sheetsApiKey: \"$KEY\"/" web/config.js
          grep -q "$KEY" web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
